name: Build and Analyze

on:
  push:
    branches:
    - "main"
    - "dev"
    - "develop"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES"

  pull_request:
    branches:
    - "main"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

    - name: Install OpenCppCoverage
      run: choco install opencppcoverage -y
    
    - name: Build the solution
      run: cmake --build build

    - name: Run Unit Tests with Coverage
      run: |
        & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" --export_type cobertura:coverage.xml --sources "${{ github.workspace }}" -- .\out\build\DroneShow_Test\DroneShow_Test.exe
      shell: powershell

    - name: Upload Coverage Report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report
        path: coverage.xml

  code-analytics:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download Coverage Report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report

      - name: Fix coverage paths for Linux
        run: |
          # 1. Convert Windows backslashes to Linux forward slashes
          sed -i 's/\\/\//g' coverage.xml
          
          # 2. Make paths relative to the repository root
          sed -i 's|filename="a/ECSDroneShow/ECSDroneShow/|filename="|g' coverage.xml
          
          # 3. Clean up Windows-specific absolute paths from package names
          sed -i "s|D:/a/ECSDroneShow/ECSDroneShow/||g" coverage.xml
          
          # 4. Fix the Cobertura <source> root path
          LINUX_WORKSPACE="${{ github.workspace }}"
          sed -i "s|<source>D:</source>|<source>$LINUX_WORKSPACE</source>|g" coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cfamily.cobertura.reportPaths=coverage.xml

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}